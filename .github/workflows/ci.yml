name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Build Environment
        run: |
          xcodebuild -version
          swift --version

      # Releases inject MARKETING_VERSION from ./VERSION, so a stale project value only
      # misleads locally — which is where it went unnoticed at 1.0 for eighteen releases.
      - name: Verify Version Consistency
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          PROJECT_VERSIONS="$(grep -o 'MARKETING_VERSION = [^;]*;' MenuMines.xcodeproj/project.pbxproj \
            | sed -E 's/MARKETING_VERSION = (.*);/\1/' | sort -u)"

          if [ "$PROJECT_VERSIONS" != "$FILE_VERSION" ]; then
            echo "::error::./VERSION is $FILE_VERSION but the project has: $(echo "$PROJECT_VERSIONS" | tr '\n' ' '). Run scripts/set-version.sh $FILE_VERSION."
            exit 1
          fi
          echo "Version $FILE_VERSION is consistent across VERSION and the Xcode project."

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.swift', '**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Build
        run: |
          xcodebuild build \
            -scheme MenuMines \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -scheme MenuMines \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
